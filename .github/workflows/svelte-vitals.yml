# Generated by `svelte-vitals ci install`, then adjusted to match this repo's
# conventions (pinned checkout SHA, timeout, concurrency, paths-ignore).
# Re-run with --force to regenerate (re-apply the same adjustments after).
name: svelte-vitals

on:
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  svelte-vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oekazuma/svelte-vitals-action@513a53965dbecd1d844684e50695d699ff81942d # v0.5.0
        with:
          diff: origin/${{ github.base_ref }}
          baseline: origin/${{ github.base_ref }}
